name: camera_app
description: SQ Cam - 相机伴侣：WiFi 连接相机，滤镜编辑，水印，分享
# App Store uploads require a numeric build number (CFBundleVersion) greater
# than the previous upload. A bare "1.1.0" leaves FLUTTER_BUILD_NUMBER empty,
# which fails upload validation with ITMS-90062.
version: 1.2.0+24
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.5.0

  # File & path
  path_provider: ^2.1.4
  path: ^1.9.0

  # Camera / WiFi transfer (pure Dart HTTP, no platform plugin needed)
  http: ^1.2.2

  # Gallery save (system photo library)
  gal: ^2.3.0

  # Sharing logs / files via system share sheet
  share_plus: ^10.1.4

  # CoreML/TFLite inference is handled via native platform channel
  # (ios/Runner/CoreMLPlugin.swift, android/.../CoreMLPlugin.kt)

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  # exif: 已移除 —— 全工程没有任何代码读取 EXIF（App 从不处理照片 GPS 元数据），
  # 留着只会在上架审核时多出一个无用的隐私面。
  # 需要写入 DateTimeOriginal 时用 lib/services/jpeg_exif.dart（手写，无依赖）。

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_lints 4.x: 5.x requires Dart 3.7+, ohos fork is Flutter 3.27.4 (Dart 3.6)
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/frames/
    - assets/film_presets/
    # NOTE: assets/firmware/ 故意不在这里列。
    #
    # 商店版不带固件：多出约 9.6 MB，且刷写中断会把相机变砖。
    #
    # 内测/售后包临时挂载：
    #   bash scripts/build_adhoc_ios.sh --ota
    # 该脚本仅在三个文件齐全时才把这一行加进构建，构建结束后自动还原：
    #   assets/firmware/manifest.json, boot.img, rootfs.img
    # OTA 界面本身在 kOtaTools（services/dev_flags.dart）后面，商店版没有升级入口。

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon.png"
  # iOS rejects icons with an alpha channel at upload time.
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 24
  # Adaptive icon: Android crops the outer third of the 108dp canvas, so the
  # full-bleed square artwork is shrunk into the 72dp safe zone on transparency
  # (scripts/make_android_adaptive_icon.py) over a flat studio-backdrop colour.
  adaptive_icon_background: "#E1DFDA"
  adaptive_icon_foreground: "assets/icon_foreground.png"
