name: camera_app
description: 相机伴侣 - WiFi连接相机，AI滤镜编辑，水印，分享
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0

  # Image handling
  image_picker: ^1.1.2
  image: ^4.5.0

  # File & path
  path_provider: ^2.1.4
  path: ^1.9.0

  # Camera / WiFi transfer (HTTP is pure Dart, works on ohos)
  http: ^1.2.2

  # Gallery save (system photo library) — needs ohos backend
  gal: ^2.3.0

  # Sharing logs / files via system share sheet — needs ohos backend (stub first)
  share_plus: ^10.1.4

  # CoreML/TFLite inference is handled via native platform channel
  # (ios/Runner/CoreMLPlugin.swift, android/.../CoreMLPlugin.kt)

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  exif: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # flutter_lints 4.x: 5.x requires Dart 3.7+, ohos fork is Flutter 3.27.4 (Dart 3.6)
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/frames/
    - assets/film_presets/
    - assets/firmware/

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon.png"
