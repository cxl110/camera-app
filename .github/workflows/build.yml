name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          pip install coremltools torch torchvision numpy pillow tqdm

      - name: Check for existing CoreML models
        id: check_models
        run: |
          if ls assets/models/*.mlmodelc 2>/dev/null | head -1; then
            echo "models_exist=true" >> $GITHUB_OUTPUT
            echo "CoreML models found, skipping conversion"
          else
            echo "models_exist=false" >> $GITHUB_OUTPUT
            echo "No CoreML models found, running conversion"
          fi

      - name: Clone filter4free checkpoints
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          git clone --depth 1 https://github.com/cxl110/filter4free.git /tmp/filter4free
          mkdir -p filter4free_checkpoints
          cp -r /tmp/filter4free/gui/static/checkpoints/* ./filter4free_checkpoints/ || true
          mkdir -p filter4free
          cp /tmp/filter4free/models.py ./filter4free/ 2>/dev/null || true

      - name: Convert Filter4Free models to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./filter4free_checkpoints \
            --output-dir ./assets/models \
            --force

      - name: Convert EDSR model to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./pretrained_checkpoints \
            --output-dir ./assets/models \
            --convert-edsr \
            --force

      - name: List converted models
        run: |
          echo "=== CoreML models ==="
          ls -lh assets/models/ 2>/dev/null || echo "No model files"

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          # First build attempt may fail due to missing Swift file in Xcode project
          # We handle that by checking if CoreMLPlugin.swift is already compiled
          flutter build ios --release --no-codesign 2>&1 | tee build_output.txt || true

          # Check if the error is about CoreMLPlugin not being in Xcode project
          if grep -q "Cannot find 'CoreMLPlugin' in scope" build_output.txt; then
            echo "Adding CoreMLPlugin.swift to Xcode project and retrying..."

            # Use PlistBuddy to add CoreMLPlugin.swift to the PBXBuildFile section
            # First, get a unique ID for the file reference
            FILE_ID=$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-')
            BUILD_ID=$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-')
            PROJ="ios/Runner.xcodeproj/project.pbxproj"

            # Find the PBXGroup section for Runner and add our file reference
            # Add CoreMLPlugin.swift reference to the project
            cat > /tmp/add_coreml.py << 'PYEOF'
import os
import re
import uuid

proj_path = 'ios/Runner.xcodeproj/project.pbxproj'
with open(proj_path, 'r') as f:
    content = f.read()

# Generate unique IDs
file_ref_id = uuid.uuid4().hex[:24].upper()
build_file_id = uuid.uuid4().hex[:24].upper()

# 1. Add file reference to PBXFileReference section
file_ref = f'\t\t{file_ref_id} /* CoreMLPlugin.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = CoreMLPlugin.swift; sourceTree = "<group>"; }};'
content = content.replace(
    '/* End PBXFileReference section */',
    f'{file_ref}\n\t\t/* End PBXFileReference section */'
)

# 2. Add build file to PBXBuildFile section
build_file = f'\t\t{build_file_id} /* CoreMLPlugin.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {file_ref_id} /* CoreMLPlugin.swift */; }};'
content = content.replace(
    '/* End PBXBuildFile section */',
    f'{build_file}\n\t\t/* End PBXBuildFile section */'
)

# 3. Add file reference to Runner group (find the group with path = "Runner")
# Look for the PBXGroup that has children containing AppDelegate.swift
content = content.replace(
    'AppDelegate.swift',
    f'AppDelegate.swift,\n\t\t\t\t{file_ref_id} /* CoreMLPlugin.swift */,'
)

# 4. Add build file to Sources build phase
# Find the PBXSourcesBuildPhase section and add our file
sources_section = re.search(r'/* Begin PBXSourcesBuildPhase section \*/\n(.*?)\n\t\t\t/* End PBXSourcesBuildPhase section \*/', content, re.DOTALL)
if sources_section:
    section_content = sources_section.group(1)
    # Find the first build phase and add our file
    # Look for the pattern: files = ( ... ) in the sources build phase
    files_match = re.search(r'(files = \()', section_content)
    if files_match:
        insertion = f'{build_file_id} /* CoreMLPlugin.swift in Sources */,\n\t\t\t\t'
        # Insert after the opening parenthesis
        pos = files_match.end()
        section_content = section_content[:pos] + '\n\t\t\t\t' + insertion + section_content[pos:]
        content = content[:sources_section.start(1)] + section_content + content[sources_section.end(1):]

with open(proj_path, 'w') as f:
    f.write(content)

print(f"Added CoreMLPlugin.swift (file_ref={file_ref_id}, build_file={build_file_id})")
PYEOF
            python3 /tmp/add_coreml.py

            # Retry build
            flutter build ios --release --no-codesign
          else
            # Build succeeded first time
            echo "Build succeeded!"
          fi

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CameraApp.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-iOS
          path: CameraApp.ipa
          retention-days: 7