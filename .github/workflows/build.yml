name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto bump build number
        run: |
          # Read current version from pubspec.yaml (e.g. "1.0.1+6")
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION=$(echo "$CURRENT" | cut -d+ -f1)   # "1.0.1"
          BUILD=$(echo "$CURRENT" | cut -d+ -f2)     # "6"
          # Increment build number
          NEW_BUILD=$((BUILD + 1))
          NEW_VERSION="${VERSION}+${NEW_BUILD}"
          # Use GitHub run_number as a fallback to guarantee uniqueness
          # Format: major.minor.patch+run_number
          UNIQUE_BUILD=$((GITHUB_RUN_NUMBER))
          NEW_VERSION="${VERSION}+${UNIQUE_BUILD}"
          sed -i '' "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Version bumped: ${CURRENT} → ${NEW_VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          pip install coremltools torch torchvision numpy pillow tqdm

      - name: Check for existing CoreML models
        id: check_models
        run: |
          if [ -f assets/models/edsr_base_x2.mlmodel ]; then
            echo "models_exist=true" >> "$GITHUB_OUTPUT"
            echo "CoreML models found, skipping conversion"
          else
            echo "models_exist=false" >> "$GITHUB_OUTPUT"
            echo "No CoreML models found, running conversion"
          fi

      - name: Convert Filter4Free models to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./filter4free_checkpoints \
            --output-dir ./assets/models \
            --force

      - name: Convert EDSR model to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./pretrained_checkpoints \
            --output-dir ./assets/models \
            --convert-edsr \
            --force

      - name: List converted models
        run: |
          echo "=== CoreML model files ==="
          ls -lh assets/models/ 2>/dev/null || echo "No model files"
          echo "=== .mlmodelc directories ==="
          ls -d assets/models/*.mlmodelc/ 2>/dev/null || echo "No .mlmodelc dirs"

      - name: Install dependencies
        run: flutter pub get

      - name: Add CoreMLPlugin.swift to Xcode project
        run: python scripts/add_coreml_to_xcode.py

      - name: Build iOS (no codesign)
        run: |
          # Build with Xcode directly to avoid Flutter's codesign check
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -5
          cd ..

      - name: Package as IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/Build/Products/Release-iphoneos -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in build output"
            find build/ios -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r CameraApp.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-iOS
          path: CameraApp.ipa
          retention-days: 7