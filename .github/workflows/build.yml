name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto bump version
        run: |
          # Read current version from pubspec.yaml (e.g. "1.0.2")
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)           # "1"
          MINOR=$(echo "$CURRENT" | cut -d. -f2)           # "0"
          PATCH=$(echo "$CURRENT" | cut -d. -f3)           # "2"
          # Increment patch version: 1.0.2 → 1.0.3
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i '' "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Version bumped: ${CURRENT} → ${NEW_VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          pip install coremltools torch torchvision numpy pillow tqdm

      - name: Check for existing CoreML models
        id: check_models
        run: |
          if [ -f assets/models/edsr_base_x2.mlmodel ]; then
            echo "models_exist=true" >> "$GITHUB_OUTPUT"
            echo "CoreML models found, skipping conversion"
          else
            echo "models_exist=false" >> "$GITHUB_OUTPUT"
            echo "No CoreML models found, running conversion"
          fi

      - name: Convert Filter4Free models to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./filter4free_checkpoints \
            --output-dir ./assets/models \
            --force

      - name: Convert EDSR model to CoreML (always reconvert)
        run: |
          rm -rf assets/models/edsr_base_x2.mlmodel assets/models/edsr_base_x2.mlmodelc
          python scripts/convert_models.py \
            --checkpoints-dir ./pretrained_checkpoints \
            --output-dir ./assets/models \
            --convert-edsr \
            --force

      - name: List converted models
        run: |
          echo "=== CoreML model files ==="
          ls -lh assets/models/ 2>/dev/null || echo "No model files"
          echo "=== .mlmodelc directories ==="
          ls -d assets/models/*.mlmodelc/ 2>/dev/null || echo "No .mlmodelc dirs"

      - name: Install dependencies
        run: flutter pub get

      - name: Add CoreMLPlugin.swift to Xcode project
        run: python scripts/add_coreml_to_xcode.py

      - name: Build iOS (no codesign)
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          python3 -c "
          import re, sys
          with open(sys.argv[1],'r') as f: c=f.read()
          c = re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER = .*?;)', r'\1\n\t\t\t\tDEVELOPMENT_TEAM = \"0000000000\";', c)
          c = c.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          with open(sys.argv[1],'w') as f: f.write(c)
          print('Updated pbxproj with DEVELOPMENT_TEAM and Manual signing')
          " "$PBX"
          flutter build ios --release --no-codesign

      - name: Copy compiled CoreML models into Runner.app
        run: |
          # Flutter asset system only includes files, not directories.
          # .mlmodelc bundles are directories → they're NOT in the Flutter bundle.
          # Copy them into Runner.app/Resources so Bundle.main can find them.
          APP_DIR="build/ios/iphoneos/Runner.app"
          for modelc in assets/models/*.mlmodelc; do
            [ -d "$modelc" ] && cp -r "$modelc" "$APP_DIR/"
          done
          echo "=== Models in Runner.app ==="
          ls -d "$APP_DIR"/*.mlmodelc/ 2>/dev/null | wc -l
          echo "=== .mlmodel files in Flutter assets ==="
          find "$APP_DIR" -name "*.mlmodel" | wc -l

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          # Standard IPA structure: Payload/Runner.app/... at zip root
          # -0 = store mode (no compression) to prevent binary corruption
          zip -0 -r CameraApp.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-iOS
          path: CameraApp.ipa
          retention-days: 7