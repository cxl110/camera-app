name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          pip install coremltools torch torchvision numpy pillow tqdm

      - name: Check for existing CoreML models
        id: check_models
        run: |
          if ls assets/models/*.mlmodelc 2>/dev/null | head -1; then
            echo "models_exist=true" >> $GITHUB_OUTPUT
            echo "CoreML models found, skipping conversion"
          else
            echo "models_exist=false" >> $GITHUB_OUTPUT
            echo "No CoreML models found, running conversion"
          fi

      - name: Clone filter4free checkpoints
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          git clone --depth 1 https://github.com/cxl110/filter4free.git /tmp/filter4free
          mkdir -p filter4free_checkpoints
          cp -r /tmp/filter4free/gui/static/checkpoints/* ./filter4free_checkpoints/ || true
          mkdir -p filter4free
          cp /tmp/filter4free/models.py ./filter4free/ 2>/dev/null || true

      - name: Convert Filter4Free models to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./filter4free_checkpoints \
            --output-dir ./assets/models \
            --force 2>&1 | tail -30

      - name: Convert EDSR model to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./pretrained_checkpoints \
            --output-dir ./assets/models \
            --convert-edsr \
            --force 2>&1 | tail -20

      - name: List converted models
        run: |
          echo "=== CoreML model files ==="
          ls -lh assets/models/ 2>/dev/null || echo "No model files"

      - name: Install dependencies
        run: flutter pub get

      - name: Add CoreMLPlugin.swift to Xcode project
        run: |
          python3 -c "
import os, re, uuid, sys

proj_path = 'ios/Runner.xcodeproj/project.pbxproj'
with open(proj_path, 'r') as f:
    content = f.read()

# Check if already added
if 'CoreMLPlugin.swift' in content:
    print('CoreMLPlugin.swift already in Xcode project')
    sys.exit(0)

file_ref_id = uuid.uuid4().hex[:24].upper()
build_file_id = uuid.uuid4().hex[:24].upper()

# 1. Add to PBXFileReference section
file_ref = '\t\t' + file_ref_id + ' /* CoreMLPlugin.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = CoreMLPlugin.swift; sourceTree = \"<group>\"; };\n'
content = content.replace('/* End PBXFileReference section */', file_ref + '\t\t/* End PBXFileReference section */')

# 2. Add to PBXBuildFile section
build_file = '\t\t' + build_file_id + ' /* CoreMLPlugin.swift in Sources */ = {isa = PBXBuildFile; fileRef = ' + file_ref_id + ' /* CoreMLPlugin.swift */; };\n'
content = content.replace('/* End PBXBuildFile section */', build_file + '\t\t/* End PBXBuildFile section */')

# 3. Add to Runner group (after AppDelegate.swift reference)
content = content.replace('AppDelegate.swift', 'AppDelegate.swift,\n\t\t\t\t' + file_ref_id + ' /* CoreMLPlugin.swift */,', 1)

# 4. Add to Sources build phase
sources_section = re.search(r'/* Begin PBXSourcesBuildPhase section \*/\\n(.*?)\n\t\t\t/* End PBXSourcesBuildPhase section \*/', content, re.DOTALL)
if sources_section:
    section_content = sources_section.group(1)
    files_match = re.search(r'\(', section_content)
    if files_match:
        insertion = '\\n\t\t\t\t\t' + build_file_id + ' /* CoreMLPlugin.swift in Sources */,'
        pos = files_match.end()
        section_content = section_content[:pos] + insertion + section_content[pos:]
        content = content[:sources_section.start(1)] + section_content + content[sources_section.end(1):]

with open(proj_path, 'w') as f:
    f.write(content)

print('Successfully added CoreMLPlugin.swift to Xcode project')
print('File ref ID:', file_ref_id)
print('Build file ID:', build_file_id)
"

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CameraApp.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-iOS
          path: CameraApp.ipa
          retention-days: 7