name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          pip install coremltools torch torchvision numpy pillow tqdm

      - name: Check for existing CoreML models
        id: check_models
        run: |
          if ls assets/models/*.mlmodelc 2>/dev/null | head -1; then
            echo "models_exist=true" >> $GITHUB_OUTPUT
            echo "CoreML models found, skipping conversion"
          else
            echo "models_exist=false" >> $GITHUB_OUTPUT
            echo "No CoreML models found, running conversion"
          fi

      - name: Clone filter4free checkpoints
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          git clone --depth 1 https://github.com/cxl110/filter4free.git /tmp/filter4free
          mkdir -p filter4free_checkpoints
          cp -r /tmp/filter4free/gui/static/checkpoints/* ./filter4free_checkpoints/ || true
          mkdir -p filter4free
          cp /tmp/filter4free/models.py ./filter4free/ 2>/dev/null || true

      - name: Convert Filter4Free models to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./filter4free_checkpoints \
            --output-dir ./assets/models \
            --force

      - name: Convert EDSR model to CoreML
        if: steps.check_models.outputs.models_exist == 'false'
        run: |
          python scripts/convert_models.py \
            --checkpoints-dir ./pretrained_checkpoints \
            --output-dir ./assets/models \
            --convert-edsr \
            --force

      - name: List converted models
        run: |
          echo "=== CoreML models ==="
          ls -lh assets/models/ 2>/dev/null || echo "No model files"

      - name: Install dependencies
        run: flutter pub get

      - name: Add CoreMLPlugin.swift to Xcode project
        run: |
          # Use ruby script to add the Swift file to Xcode project
          ruby -e '
          require "xcodeproj"
          project_path = "ios/Runner.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == "Runner" }

          # Find group for Runner
          group = project.main_group.find_subpath(File.join("Runner"), true)
          group.set_source_tree("SOURCE_ROOT")

          # Add CoreMLPlugin.swift reference
          file_path = "CoreMLPlugin.swift"
          if !target.source_build_phase.files_references.any? { |f| f.path == file_path }
            file_ref = group.new_reference(file_path)
            target.source_build_phase.add_file_reference(file_ref, true)
            puts "Added CoreMLPlugin.swift to Compile Sources"
          else
            puts "CoreMLPlugin.swift already in Compile Sources"
          end

          # Add CoreML.framework
          if !target.frameworks_build_phase.files_references.any? { |f| f.path == "CoreML.framework" }
            sdk_root = `xcrun --show-sdk-path`.strip
            framework_path = File.join(sdk_root, "System/Library/Frameworks/CoreML.framework")
            framework_ref = project.new_system_framework("CoreML.framework")
            target.frameworks_build_phase.add_file_reference(framework_ref, true)
            puts "Added CoreML.framework"
          end

          project.save
          puts "Xcode project updated successfully"
          '
        shell: bash

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CameraApp.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-iOS
          path: CameraApp.ipa
          retention-days: 7